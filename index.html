<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>
    <link rel="icon" type="image/png" sizes="32x32" href="Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 'jet-black': '#0a0a0a', 'cerulean': '#007BA7', 'neon-rose': '#FF1493' }
                }
            }
        };
        if ((localStorage.getItem('cv_theme') || 'dark') === 'dark') document.documentElement.classList.add('dark');
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- RAZORPAY SDK (REQUIRED FOR GPAY) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        .fade-in { animation: fadeIn 0.7s ease-out forwards; }
        .zoom-in-95 { animation: zoomIn 0.5s ease-out forwards; }
        .slide-in-bottom { animation: slideInBottom 0.7s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideInBottom { from { opacity: 0; transform: translateY(2rem); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-jet-black text-zinc-900 dark:text-zinc-100 font-sans min-h-screen relative overflow-x-hidden transition-colors duration-500 flex flex-col justify-between">
  
    <div id="global-bg" class="fixed inset-0 z-0 transition-all duration-1000 ease-in-out mix-blend-luminosity opacity-[0.18] dark:opacity-30 bg-cover bg-center bg-fixed"></div>
    <div class="fixed inset-0 z-0 bg-gradient-to-b from-white/80 via-white/95 to-white dark:from-jet-black/80 dark:via-jet-black/95 dark:to-jet-black pointer-events-none transition-colors duration-500"></div>

    <div class="relative z-10 w-full flex flex-col min-h-screen justify-between">
        <div id="app-root" class="w-full flex flex-col"></div>
        <div id="footer-root"></div>
    </div>
    <div id="modal-root" class="relative z-[100]"></div>

    <script>
        const fallbackAvatar = (name) => `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=FF1493&color=fff&size=200&bold=true`;

        const MOVIES = [
          { id: 1, title: "Dune: Part Two", genre: "Sci-Fi / Action", duration: "2h 46m", rating: "9.2/10", image: "https://m.media-amazon.com/images/M/MV5BNTc0YmQxMjEtODI5MC00NjFiLTlkMWUtOGQ5NjFmYWUyZGJhXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", trailer: "Way9Dexny3w", description: "Paul Atreides unites with Chani and the Fremen while on a warpath of revenge against the conspirators who destroyed his family.", actors: [{ name: "Timothée Chalamet", wiki: "Timothée_Chalamet" }, { name: "Zendaya", wiki: "Zendaya" }, { name: "Rebecca Ferguson", wiki: "Rebecca_Ferguson" }] },
          { id: 2, title: "Oppenheimer", genre: "Biography / Drama", duration: "3h", rating: "8.4/10", image: "https://upload.wikimedia.org/wikipedia/en/4/4a/Oppenheimer_%28film%29.jpg", trailer: "uYPbbksJxIg", description: "The story of American scientist, J. Robert Oppenheimer, and his role in the development of the atomic bomb.", actors: [{ name: "Cillian Murphy", wiki: "Cillian_Murphy" }, { name: "Emily Blunt", wiki: "Emily_Blunt" }, { name: "Robert Downey Jr.", wiki: "Robert_Downey_Jr." }] },
          { id: 5, title: "Jawan", genre: "Action / Thriller", duration: "2h 49m", rating: "8.1/10", image: "https://upload.wikimedia.org/wikipedia/en/3/39/Jawan_film_poster.jpg", trailer: "COv52Qyctws", description: "A high-octane action thriller which outlines the emotional journey of a man who is set to rectify the wrongs in the society.", actors: [{ name: "Shah Rukh Khan", wiki: "Shah_Rukh_Khan" }, { name: "Nayanthara", wiki: "Nayanthara" }, { name: "Vijay Sethupathi", wiki: "Vijay_Sethupathi" }] },
          { id: 6, title: "RRR", genre: "Action / Epic", duration: "3h 7m", rating: "8.8/10", image: "https://upload.wikimedia.org/wikipedia/en/d/d7/RRR_Poster.jpg", trailer: "GURJpN-x_qI", description: "A fictitious story about two legendary revolutionaries and their journey away from home before they started fighting for their country in 1920s.", actors: [{ name: "N.T. Rama Rao Jr.", wiki: "N._T._Rama_Rao_Jr." }, { name: "Ram Charan", wiki: "Ram_Charan" }, { name: "Alia Bhatt", wiki: "Alia_Bhatt" }] },
          { id: 3, title: "Spider-Man: Across the Spider-Verse", genre: "Animation / Action", duration: "2h 20m", rating: "8.6/10", image: "https://upload.wikimedia.org/wikipedia/en/b/b4/Spider-Man-_Across_the_Spider-Verse_poster.jpg", trailer: "shW9i6k8cB0", description: "Miles Morales catapults across the Multiverse, where he encounters a team of Spider-People charged with protecting its very existence.", actors: [{ name: "Shameik Moore", wiki: "Shameik_Moore" }, { name: "Hailee Steinfeld", wiki: "Hailee_Steinfeld" }, { name: "Oscar Isaac", wiki: "Oscar_Isaac" }] },
          { id: 9, title: "Interstellar", genre: "Sci-Fi / Adventure", duration: "2h 49m", rating: "8.7/10", image: "https://upload.wikimedia.org/wikipedia/en/b/bc/Interstellar_film_poster.jpg", trailer: "zSWdZVtXT7E", description: "When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot is tasked to pilot a spacecraft to find a new planet for humans.", actors: [{ name: "Matthew McConaughey", wiki: "Matthew_McConaughey" }, { name: "Anne Hathaway", wiki: "Anne_Hathaway" }, { name: "Jessica Chastain", wiki: "Jessica_Chastain" }] }
        ];

        const RECENT_RELEASES = [
          { id: 107, title: "Deadpool & Wolverine", genre: "Action / Comedy", duration: "2h 8m", rating: "8.0/10", image: "https://upload.wikimedia.org/wikipedia/en/4/4c/Deadpool_%26_Wolverine_poster.jpg", trailer: "73_1biulkYk", description: "A listless Wade Wilson toils away in civilian life. His days as the morally flexible mercenary, Deadpool, behind him.", actors: [{ name: "Ryan Reynolds", wiki: "Ryan_Reynolds" }, { name: "Hugh Jackman", wiki: "Hugh_Jackman" }, { name: "Emma Corrin", wiki: "Emma_Corrin" }] },
          { id: 105, title: "Animal", genre: "Crime / Drama", duration: "3h 21m", rating: "7.8/10", image: "https://m.media-amazon.com/images/M/MV5BZThmNDg1NjUtNWJhMC00YjA3LWJiMjItNmM4ZDQ5ZGZiN2Y2XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", trailer: "WuH9ahB-68Q", description: "The hardened son of a powerful industrialist returns home after years abroad and vows to take blood revenge on those threatening his father's life.", actors: [{ name: "Ranbir Kapoor", wiki: "Ranbir_Kapoor" }, { name: "Anil Kapoor", wiki: "Anil_Kapoor" }, { name: "Rashmika Mandanna", wiki: "Rashmika_Mandanna" }] },
          { id: 7, title: "Kalki 2898 AD", genre: "Sci-Fi / Action", duration: "3h 1m", rating: "8.5/10", image: "https://m.media-amazon.com/images/M/MV5BMTM3ZGUwYTEtZTI5NS00ZmMyLTk2YmQtMWU4YjlhZTI3NjRjXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", trailer: "xoMyZhjAG7Y", description: "A modern-day avatar of Vishnu, a Hindu god, who is believed to have descended to earth to protect the world from evil forces in a dystopian future.", actors: [{ name: "Prabhas", wiki: "Prabhas" }, { name: "Amitabh Bachchan", wiki: "Amitabh_Bachchan" }, { name: "Deepika Padukone", wiki: "Deepika_Padukone" }] }
        ];

        // Format actors to have default images
        [...MOVIES, ...RECENT_RELEASES].forEach(m => m.actors.forEach(a => { if(!a.image) a.image = fallbackAvatar(a.name); }));

        const MARVEL_BACKGROUNDS = {
            login: "https://images.unsplash.com/photo-1635863138275-d9b33299680b?auto=format&fit=crop&w=2070&q=80",
            home: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=2070&q=80",
            movies: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=2070&q=80",
            releases: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=2070&q=80",
            booking: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=2070&q=80",
            seats: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=2070&q=80",
            confirm: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=2070&q=80",
            history: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=2070&q=80"
        };

        async function loadRealImages() {
            const tasks = [];
            [...MOVIES, ...RECENT_RELEASES].forEach(movie => {
                movie.actors.forEach(actor => {
                    if (actor.wiki) {
                        tasks.push(
                            fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(actor.wiki)}`)
                                .then(res => res.json())
                                .then(data => { if (data?.thumbnail?.source) actor.image = data.thumbnail.source; })
                                .catch(() => {})
                        );
                    }
                });
            });
            await Promise.allSettled(tasks);
            render(); 
        }

        const THEATERS = ["PVR Acropolis (SG Highway)", "Cinepolis (Ahmedabad One Mall)", "NY Cinemas (CG Road)", "City Gold (Ashram Road)"];
        const DATES = ["Today", "Tomorrow", "Friday", "Saturday"];
        const TIMES = ["10:30 AM", "1:15 PM", "4:00 PM", "7:30 PM", "10:00 PM"];

        let state = {
            theme: localStorage.getItem('cv_theme') || 'dark',
            user: localStorage.getItem('cv_user_id') ? { id: localStorage.getItem('cv_user_id'), email: localStorage.getItem('cv_user_email') } : null,
            currentView: localStorage.getItem('cv_user_id') ? 'home' : 'login',
            showTrailer: false,
            activeTrailerId: null,
            activeModal: null, 
            selectedMovie: null,
            bookingDetails: { date: '', theater: '', time: '' },
            selectedSeats: [],
            confirmedTicket: null
        };

        function setState(updates) {
            state = { ...state, ...updates };
            render();
        }

        window.toggleTheme = () => {
            const newTheme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('cv_theme', newTheme);
            if (newTheme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            setState({ theme: newTheme });
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const fallbackId = 'local_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('cv_user_id', fallbackId);
            localStorage.setItem('cv_user_email', email);
            setState({ user: { id: fallbackId, email }, currentView: 'home' });
        };

        window.handleLogout = () => {
            localStorage.removeItem('cv_user_id');
            localStorage.removeItem('cv_user_email');
            setState({ user: null, currentView: 'login', selectedMovie: null, bookingDetails: { date: '', theater: '', time: '' }, selectedSeats: [] });
        };

        window.resetBookingAndGo = (view) => setState({ currentView: view, selectedMovie: null, bookingDetails: { date: '', theater: '', time: '' }, selectedSeats: [] });
        window.selectMovie = (id) => setState({ selectedMovie: MOVIES.find(m => m.id === id) || RECENT_RELEASES.find(m => m.id === id), currentView: 'booking', bookingDetails: { date: '', theater: '', time: '' }, selectedSeats: [] });
        window.updateBooking = (key, value) => setState({ bookingDetails: { ...state.bookingDetails, [key]: value } });
        
        window.toggleSeat = (seatId, isOccupied) => {
            if (isOccupied) return;
            let seats = [...state.selectedSeats];
            if (seats.includes(seatId)) seats = seats.filter(id => id !== seatId);
            else if (seats.length < 8) seats.push(seatId);
            setState({ selectedSeats: seats });
        };

        // --- RAZORPAY & GPAY INTEGRATION ---
        window.processRealPayment = (amount) => {
            var options = {
                "key": "rzp_test_YOUR_KEY_HERE", // NOTE: Replace with real Razorpay Key
                "amount": amount * 100, // Amount is in paise (₹1 = 100 paise)
                "currency": "INR",
                "name": "CineVault",
                "description": "Movie Ticket Booking",
                "image": "Logo.png",
                "handler": function (response) {
                    // Success callback
                    const ticketData = {
                        id: response.razorpay_payment_id,
                        movieTitle: state.selectedMovie.title,
                        date: state.bookingDetails.date,
                        time: state.bookingDetails.time,
                        theater: state.bookingDetails.theater,
                        seats: state.selectedSeats,
                        amount: amount
                    };
                    const history = JSON.parse(localStorage.getItem('cv_history') || '[]');
                    history.push(ticketData);
                    localStorage.setItem('cv_history', JSON.stringify(history));
                    
                    setState({ currentView: 'confirm', confirmedTicket: ticketData });
                },
                "prefill": {
                    "name": "Shivam Sharma", 
                    "email": "luckyjain83738@gmail.com",
                    "contact": "8141430155"
                },
                "theme": { "color": "#FF1493" }
            };
            var rzp = new Razorpay(options);
            rzp.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
            });
            rzp.open();
        };

        window.openTrailerModal = (trailerId) => setState({ showTrailer: true, activeTrailerId: trailerId });

        function renderNav() {
            const isLoggedIn = state.user && state.currentView !== 'login';
            return `
                <nav class="sticky top-0 z-50 border-b border-black/5 dark:border-white/10 bg-white/80 dark:bg-jet-black/80 backdrop-blur-xl px-6 py-4 shadow-lg transition-colors">
                    <div class="max-w-7xl mx-auto flex justify-between items-center">
                        <div class="flex items-center gap-2 cursor-pointer group" onclick="if(${isLoggedIn}) resetBookingAndGo('home')">
                            <i data-lucide="film" class="w-7 h-7 text-cerulean"></i>
                            <span class="text-2xl font-black tracking-tight text-cerulean">CINE<span class="text-zinc-900 dark:text-white">VAULT</span></span>
                        </div>
                        ${isLoggedIn ? `
                        <div class="hidden md:flex gap-8 items-center font-bold text-sm tracking-widest uppercase">
                            <button onclick="resetBookingAndGo('home')" class="hover:text-neon-rose ${state.currentView === 'home' ? 'text-neon-rose' : 'text-zinc-500'}">Home</button>
                            <button onclick="resetBookingAndGo('movies')" class="hover:text-neon-rose ${state.currentView === 'movies' ? 'text-neon-rose' : 'text-zinc-500'}">Movies</button>
                            <button onclick="resetBookingAndGo('releases')" class="hover:text-neon-rose ${state.currentView === 'releases' ? 'text-neon-rose' : 'text-zinc-500'}">Releases</button>
                        </div>` : ''}
                        <div class="flex gap-4 items-center">
                            <button onclick="toggleTheme()" class="p-2.5 bg-zinc-100 dark:bg-zinc-900 rounded-lg text-zinc-600 border border-black/5">
                                <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i>
                            </button>
                            ${isLoggedIn ? `
                            <button onclick="setState({currentView: 'history'})" class="px-5 py-2.5 bg-zinc-100 dark:bg-zinc-900 rounded-lg font-bold text-xs uppercase flex items-center gap-2"><i data-lucide="ticket" class="w-4 h-4"></i> Tickets</button>
                            <button onclick="handleLogout()" class="p-2.5 bg-neon-rose/10 text-neon-rose rounded-lg border border-neon-rose/20"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                            ` : ''}
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderFooter() {
            return `
                <footer class="mt-20 border-t border-black/5 dark:border-white/10 bg-white/60 dark:bg-jet-black/80 backdrop-blur-xl py-12 px-6">
                    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-10">
                        <div class="space-y-4">
                            <div class="flex items-center gap-2"><i data-lucide="film" class="w-6 h-6 text-cerulean"></i><span class="text-xl font-black text-cerulean">CINE<span class="text-zinc-900 dark:text-white">VAULT</span></span></div>
                            <p class="text-xs text-zinc-500 font-medium">CineVault delivers next-gen luxury movie experiences.</p>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold uppercase tracking-widest mb-4">Navigation</h4>
                            <ul class="space-y-2.5 text-xs text-zinc-500">
                                <li><button onclick="if(state.user) resetBookingAndGo('home')" class="hover:text-neon-rose">Home</button></li>
                                <li><button onclick="setState({activeModal: 'about'})" class="hover:text-neon-rose">About us</button></li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold uppercase tracking-widest mb-4">Get in Touch</h4>
                            <ul class="space-y-2.5 text-xs text-zinc-500">
                                <li class="flex items-center gap-2"><i data-lucide="phone" class="w-3.5 h-3.5 text-neon-rose"></i> 8141430155</li>
                                <li class="flex items-center gap-2"><i data-lucide="mail" class="w-3.5 h-3.5 text-neon-rose"></i> luckyjain83738@gmail.com</li>
                            </ul>
                        </div>
                    </div>
                </footer>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex flex-col items-center justify-center min-h-[75vh] fade-in zoom-in-95 px-6 my-10 w-full">
                    <div class="w-full max-w-md p-10 bg-white/90 dark:bg-zinc-900/80 border border-black/10 dark:border-white/10 shadow-2xl rounded-2xl backdrop-blur-xl text-center">
                        <i data-lucide="film" class="w-14 h-14 text-cerulean mx-auto mb-6"></i>
                        <h1 class="text-3xl font-black mb-2">Enter the Vault</h1>
                        <p class="text-zinc-500 mb-8 font-medium">Sign in to book your premium experience</p>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <input id="emailInput" type="email" placeholder="Email Address" class="w-full bg-zinc-50 dark:bg-jet-black border border-zinc-200 rounded-lg px-4 py-3.5 focus:border-neon-rose outline-none" value="luckyjain83738@gmail.com" required />
                            <input type="password" placeholder="Password" class="w-full bg-zinc-50 dark:bg-jet-black border border-zinc-200 rounded-lg px-4 py-3.5 focus:border-neon-rose outline-none" value="password123" required />
                            <button type="submit" class="w-full py-4 mt-4 text-lg bg-neon-rose text-white font-bold rounded-lg shadow-[0_0_20px_rgba(255,20,147,0.3)]">Sign In</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="max-w-7xl mx-auto px-6 py-12 w-full fade-in slide-in-bottom mt-6">
                    <div class="p-10 md:p-20 relative overflow-hidden bg-white/80 dark:bg-zinc-900/60 border border-white/10 shadow-2xl rounded-3xl backdrop-blur-lg">
                        <div class="relative z-10 flex flex-col items-start max-w-3xl">
                            <span class="px-4 py-1.5 rounded-md bg-neon-rose/10 text-neon-rose text-xs font-bold uppercase mb-6">Cinematic Experience</span>
                            <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">Immersive. <br/> <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-rose to-cerulean">Unforgettable.</span></h1>
                            <div class="flex flex-wrap gap-4 mt-10">
                                <button onclick="resetBookingAndGo('movies')" class="px-8 py-4 bg-neon-rose text-white font-bold rounded-lg shadow-[0_0_20px_rgba(255,20,147,0.3)]">Now Showing</button>
                                <button onclick="resetBookingAndGo('releases')" class="px-8 py-4 bg-zinc-100 dark:bg-zinc-800 font-bold rounded-lg">Recent Releases</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateCards(moviesArray) {
            return moviesArray.map(m => `
                <div class="tilt-card group cursor-pointer relative rounded-2xl overflow-hidden shadow-2xl bg-white/60 dark:bg-zinc-900/60 border border-white/10 transition-all duration-300 hover:border-neon-rose/50" onclick="selectMovie(${m.id})">
                    <div class="relative aspect-[2/3] overflow-hidden bg-jet-black">
                        <img src="${m.image}" class="object-cover w-full h-full group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" />
                        <div class="absolute inset-0 bg-gradient-to-t from-white via-white/60 dark:from-jet-black dark:via-jet-black/60 to-transparent opacity-90 transition-opacity duration-500"></div>
                    </div>
                    <div class="p-5 absolute bottom-0 left-0 right-0 z-20">
                        <h3 class="text-xl font-bold truncate mb-1">${m.title}</h3>
                        <p class="text-sm font-semibold text-neon-rose mb-3 uppercase">${m.genre}</p>
                        <div class="flex justify-between items-center text-sm font-medium text-zinc-400">
                            <span>${m.duration}</span><span class="text-cerulean font-bold">⭐ ${m.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderMoviesList() {
            const arr = state.currentView === 'movies' ? MOVIES : RECENT_RELEASES;
            return `
                <div class="max-w-7xl mx-auto px-6 py-12 w-full fade-in">
                    <h2 class="text-3xl font-black border-l-4 border-neon-rose pl-4 uppercase mb-10">${state.currentView === 'movies' ? 'Now Showing' : 'Recent Releases'}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">${generateCards(arr)}</div>
                </div>
            `;
        }

        function renderBooking() {
            const m = state.selectedMovie, bd = state.bookingDetails, canProceed = bd.date && bd.theater && bd.time;
            const datePills = DATES.map(d => `<button onclick="updateBooking('date', '${d}')" class="px-5 py-2.5 font-bold rounded-lg border ${bd.date === d ? 'bg-neon-rose text-white border-neon-rose shadow-[0_0_15px_rgba(255,20,147,0.3)]' : 'border-zinc-800'}">${d}</button>`).join('');
            const theaterPills = THEATERS.map(t => `<button onclick="updateBooking('theater', '${t}')" class="px-5 py-2.5 font-bold rounded-lg border ${bd.theater === t ? 'bg-cerulean text-white border-cerulean shadow-[0_0_15px_rgba(0,123,167,0.3)]' : 'border-zinc-800'}">${t}</button>`).join('');
            const timePills = TIMES.map(t => `<button onclick="updateBooking('time', '${t}')" class="px-5 py-2.5 font-bold rounded-lg border ${bd.time === t ? 'bg-zinc-100 text-jet-black' : 'border-zinc-800'}">${t}</button>`).join('');

            return `
                <div class="max-w-6xl mx-auto px-6 py-12 w-full fade-in zoom-in-95">
                    <button onclick="setState({currentView: 'movies'})" class="flex items-center gap-2 mb-8 font-bold text-zinc-500 uppercase"><i data-lucide="chevron-left" class="w-5 h-5"></i> Back to Lineup</button>
                    
                    <div class="p-8 md:p-12 bg-white/90 dark:bg-zinc-900/80 shadow-2xl rounded-3xl backdrop-blur-xl">
                        <div class="flex flex-col lg:flex-row gap-12">
                            <img src="${m.image}" class="w-full lg:w-1/3 rounded-xl object-cover shadow-2xl flex-shrink-0" />
                            <div class="flex flex-col justify-start flex-grow">
                                <h2 class="text-4xl md:text-6xl font-black mb-6">${m.title}</h2>
                                <p class="text-lg leading-relaxed mb-8 text-zinc-400 font-medium">${m.description}</p>
                                <button onclick="openTrailerModal('${m.trailer}')" class="flex items-center gap-2 w-fit px-6 py-3 mb-12 font-bold bg-zinc-800 rounded-lg"><i data-lucide="play-circle" class="w-5 h-5 text-neon-rose"></i> Watch Trailer</button>
                            </div>
                        </div>

                        <div class="mt-16 pt-12 border-t border-white/10">
                            <h3 class="text-2xl font-black mb-10 text-center uppercase">Select Showtime</h3>
                            <div class="flex flex-col gap-8 max-w-5xl mx-auto">
                                <div class="flex gap-4"><label class="font-bold text-zinc-500 w-32 uppercase">Date</label><div class="flex flex-wrap gap-3">${datePills}</div></div>
                                <div class="flex gap-4"><label class="font-bold text-zinc-500 w-32 uppercase">Theater</label><div class="flex flex-wrap gap-3">${theaterPills}</div></div>
                                <div class="flex gap-4"><label class="font-bold text-zinc-500 w-32 uppercase">Time</label><div class="flex flex-wrap gap-3">${timePills}</div></div>
                            </div>
                            <div class="mt-16 flex justify-center">
                                <button ${!canProceed ? 'disabled' : ''} onclick="setState({currentView: 'seats'})" class="px-12 py-4 text-lg bg-neon-rose text-white font-black uppercase rounded-lg disabled:opacity-50">Select Seats</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSeats() {
            const m = state.selectedMovie, bd = state.bookingDetails;
            const standardRows = ['A', 'B', 'C', 'D'], reclinerRows = ['E', 'F'], cols = [1, 2, 3, 4, 5, 6, 7, 8];
            const totalAmount = state.selectedSeats.reduce((t, s) => t + (s.startsWith('E') || s.startsWith('F') ? 450 : 250), 0);

            const renderRow = (row, labelClass = "text-zinc-600") => {
                let rowHtml = `<div class="flex gap-4 items-center mb-2"><span class="w-6 font-bold text-center ${labelClass}">${row}</span><div class="flex gap-2 sm:gap-3">`;
                cols.forEach(col => {
                    const seatId = `${row}${col}`, seed = seatId.charCodeAt(0) + seatId.charCodeAt(1) + m.id;
                    const isOccupied = seed % 5 === 0, isSelected = state.selectedSeats.includes(seatId), isRecliner = row === 'E' || row === 'F';
                    let bgClass = isOccupied ? 'bg-zinc-300 dark:bg-jet-black text-transparent opacity-50 cursor-not-allowed' : 
                                    isSelected ? (isRecliner ? 'bg-cerulean text-white' : 'bg-neon-rose text-white') : 'bg-zinc-800 text-zinc-400 hover:bg-zinc-700';
                    rowHtml += `<button onclick="toggleSeat('${seatId}', ${isOccupied})" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center text-xs font-bold rounded-t-xl ${bgClass}">${isSelected ? seatId : ''}</button>`;
                    if (col === 4) rowHtml += `<div class="w-6 sm:w-10"></div>`;
                });
                return rowHtml + `</div><span class="w-6 font-bold text-center ${labelClass}">${row}</span></div>`;
            };

            return `
                <div class="max-w-4xl mx-auto px-6 py-12 w-full fade-in zoom-in-95">
                    <div class="flex justify-between items-center mb-8">
                        <button onclick="setState({currentView: 'booking'})" class="font-bold text-zinc-500 uppercase"><i data-lucide="chevron-left" class="inline w-5 h-5"></i> Change Time</button>
                        <div class="text-right">
                            <p class="font-black text-xl uppercase">${m.title}</p>
                            <p class="text-sm font-bold text-zinc-500 uppercase">${bd.date} | ${bd.time}</p>
                        </div>
                    </div>
                    <div class="p-8 md:p-12 bg-white/90 dark:bg-zinc-900/80 shadow-2xl rounded-3xl backdrop-blur-xl">
                        <div class="flex flex-col gap-4 items-center mb-12 overflow-x-auto no-scrollbar">
                            <p class="text-xs font-bold text-zinc-500 mb-2 uppercase">Standard / ₹250</p>
                            ${standardRows.map(row => renderRow(row)).join('')}
                            <div class="w-full border-t border-zinc-800 my-6"></div>
                            <p class="text-xs font-bold text-cerulean mb-2 uppercase">Premium Recliners / ₹450</p>
                            ${reclinerRows.map(row => renderRow(row, "text-cerulean")).join('')}
                        </div>
                        <div class="flex flex-col sm:flex-row justify-between items-center pt-8 border-t border-zinc-800">
                            <div>
                                <p class="text-xs font-bold text-zinc-500 mb-1 uppercase">Selected Seats</p>
                                <p class="font-black text-xl text-neon-rose">${state.selectedSeats.length > 0 ? state.selectedSeats.join(', ') : 'NONE'}</p>
                            </div>
                            <div class="flex items-center gap-8">
                                <div class="text-right">
                                    <p class="text-xs font-bold text-zinc-500 mb-1 uppercase">Total Amount</p>
                                    <p class="font-black text-3xl">₹${totalAmount}</p>
                                </div>
                                <button ${state.selectedSeats.length === 0 ? 'disabled' : ''} onclick="processRealPayment(${totalAmount})" class="px-10 py-4 bg-cerulean hover:opacity-80 text-white font-black uppercase rounded-lg disabled:opacity-50 flex gap-2"><i data-lucide="smartphone"></i> Pay via UPI / GPay</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderConfirm() {
            const t = state.confirmedTicket;
            return `
                <div class="max-w-7xl mx-auto px-6 py-12 w-full fade-in zoom-in-95">
                    <div class="flex flex-col items-center justify-center">
                        <div class="p-10 w-full max-w-md bg-white/90 dark:bg-zinc-900/80 shadow-2xl rounded-3xl backdrop-blur-xl text-center">
                            <i data-lucide="check-circle-2" class="w-16 h-16 text-green-500 mx-auto mb-6"></i>
                            <h2 class="text-3xl font-black mb-2 uppercase">Payment Successful!</h2>
                            <p class="text-sm font-medium mb-8 text-zinc-500 uppercase">TXN ID: ${t.id}</p>
                            <div class="text-left mb-8 p-6 rounded-xl bg-jet-black shadow-inner">
                                <h3 class="font-black text-xl mb-6 text-neon-rose uppercase">${t.movieTitle}</h3>
                                <div class="grid grid-cols-2 gap-y-4 text-sm">
                                    <div><p class="text-zinc-500 font-bold uppercase text-xs">Date</p><p class="font-bold">${t.date}</p></div>
                                    <div><p class="text-zinc-500 font-bold uppercase text-xs">Time</p><p class="font-bold">${t.time}</p></div>
                                    <div class="col-span-2"><p class="text-zinc-500 font-bold uppercase text-xs">Theater</p><p class="font-bold">${t.theater}</p></div>
                                    <div class="col-span-2"><p class="text-zinc-500 font-bold uppercase text-xs">Seats</p><p class="font-black text-lg text-cerulean">${t.seats.join(', ')}</p></div>
                                </div>
                            </div>
                            <button onclick="resetBookingAndGo('home')" class="w-full py-4 text-lg bg-zinc-800 text-white font-bold uppercase rounded-lg">Back to Dashboard</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHistory() {
            const tickets = JSON.parse(localStorage.getItem('cv_history') || '[]');
            const ticketsHtml = tickets.length === 0 
                ? `<div class="text-center py-24"><p class="text-2xl font-black text-zinc-500 uppercase">No Tickets Found</p></div>`
                : tickets.map(t => `
                    <div class="bg-zinc-900/80 shadow-lg rounded-2xl p-6 flex items-center backdrop-blur-md">
                        <div class="flex-grow">
                            <h4 class="font-black text-2xl mb-2 uppercase">${t.movieTitle}</h4>
                            <p class="text-sm font-bold mb-4 text-cerulean uppercase">${t.theater}</p>
                            <div class="flex gap-3">
                                <span class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-jet-black border border-zinc-700">${t.date} | ${t.time}</span>
                                <span class="px-4 py-2 rounded-lg text-xs font-black uppercase bg-neon-rose/10 text-neon-rose">Seats: ${t.seats.join(', ')}</span>
                            </div>
                        </div>
                        <div class="text-right border-l border-zinc-800 pl-8">
                            <p class="text-zinc-500 font-bold uppercase text-xs mb-1">Total Paid</p>
                            <p class="text-3xl font-black">₹${t.amount}</p>
                        </div>
                    </div>
                  `).join('');

            return `<div class="max-w-4xl mx-auto px-6 py-12 w-full fade-in"><div class="flex items-center justify-between mb-10"><h2 class="text-3xl font-black border-l-4 border-neon-rose pl-4 uppercase">Booking History</h2><button onclick="resetBookingAndGo('home')" class="font-bold text-zinc-500 uppercase">Return</button></div><div class="flex flex-col gap-6">${ticketsHtml}</div></div>`;
        }

        function render() {
            let bgImg = MARVEL_BACKGROUNDS[state.currentView] || MARVEL_BACKGROUNDS.home;
            if (state.selectedMovie && (state.currentView === 'booking' || state.currentView === 'seats')) bgImg = state.selectedMovie.image;
            document.getElementById('global-bg').style.backgroundImage = `url('${bgImg}')`;

            let viewHtml = '';
            switch(state.currentView) {
                case 'login': viewHtml = renderLogin(); break;
                case 'home': viewHtml = renderHome(); break;
                case 'movies': case 'releases': viewHtml = renderMoviesList(); break;
                case 'booking': viewHtml = renderBooking(); break;
                case 'seats': viewHtml = renderSeats(); break;
                case 'confirm': viewHtml = renderConfirm(); break;
                case 'history': viewHtml = renderHistory(); break;
            }

            document.getElementById('app-root').innerHTML = renderNav() + `<main class="flex-grow flex justify-center w-full z-10">${viewHtml}</main>`;
            document.getElementById('footer-root').innerHTML = renderFooter();
            
            let modalContent = '';
            if (state.showTrailer && state.activeTrailerId) {
                modalContent += `<div class="fixed inset-0 z-[100] flex items-center justify-center bg-jet-black/90 p-4 backdrop-blur-xl" onclick="setState({showTrailer: false, activeTrailerId: null})"><div class="relative w-full max-w-5xl aspect-video bg-black rounded-2xl zoom-in-95 flex items-center justify-center" onclick="event.stopPropagation()"><button onclick="setState({showTrailer: false, activeTrailerId: null})" class="absolute top-4 right-4 z-10 bg-black/50 text-white p-3 rounded-full"><i data-lucide="x"></i></button><iframe src="https://www.youtube-nocookie.com/embed/${state.activeTrailerId}?autoplay=1" class="w-full h-full" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>`;
            }
            document.getElementById('modal-root').innerHTML = modalContent;
            lucide.createIcons();
        }

        render();
        loadRealImages();
    </script>
</body>
</html>
