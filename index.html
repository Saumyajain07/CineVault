            darkMode: 'class',

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideInBottom { from { opacity: 0; transform: translateY(2rem); } to { opacity: 1; transform: translateY(0); } }

        // --- AUTOMATIC WIKIPEDIA PHOTO LOADER ---
        async function loadRealImages() {
            const allMovies = [...MOVIES, ...RECENT_RELEASES];
            const tasks = [];
            allMovies.forEach(movie => {
                movie.actors.forEach(actor => {
                    if (actor.wiki) {
                        tasks.push(
                            fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(actor.wiki)}`)
                                .then(res => res.json())
                                .then(data => { if (data?.thumbnail?.source) actor.image = data.thumbnail.source; })
                                .catch(() => {})
                        );
                    }
                });
            });
            await Promise.allSettled(tasks);
            render(); 
        }

        // Updated for Ahmedabad-specific theaters
        const THEATERS = ["PVR Acropolis (SG Highway)", "Cinepolis (Ahmedabad One Mall)", "NY Cinemas (CG Road)", "City Gold (Ashram Road)"];

        const TIMES = ["10:30 AM", "1:15 PM", "4:00 PM", "7:30 PM", "10:00 PM"];

        // --- GLOBAL STATE ---
        let state = {
            theme: localStorage.getItem('cv_theme') || 'dark',
            user: localStorage.getItem('cv_user_id') ? { id: localStorage.getItem('cv_user_id'), email: localStorage.getItem('cv_user_email') } : null,
            currentView: localStorage.getItem('cv_user_id') ? 'home' : 'login',
            showTrailer: false,
            activeTrailerId: null,
            activeModal: null, 
            selectedMovie: null,
            bookingDetails: { date: '', theater: '', time: '' },
            selectedSeats: [],
            confirmedTicket: null
        };

        function setState(updates) {
            state = { ...state, ...updates };
            render();
        }

        // --- ACTIONS ---
        window.toggleTheme = () => {
            const newTheme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('cv_theme', newTheme);
            if (newTheme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            setState({ theme: newTheme });
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const fallbackId = 'local_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('cv_user_id', fallbackId);
            localStorage.setItem('cv_user_email', email);
            setState({ user: { id: fallbackId, email }, currentView: 'home' });
        };

        window.handleLogout = () => {
            localStorage.removeItem('cv_user_id');
            localStorage.removeItem('cv_user_email');
            setState({ user: null, currentView: 'login', selectedMovie: null, bookingDetails: { date: '', theater: '', time: '' }, selectedSeats: [] });
        };

        window.resetBookingAndGo = (view) => {
            setState({ currentView: view, selectedMovie: null, bookingDetails: { date: '', theater: '', time: '' }, selectedSeats: [] });
        };

        window.selectMovie = (id) => {
            const movie = MOVIES.find(m => m.id === id) || RECENT_RELEASES.find(m => m.id === id);
            setState({ selectedMovie: movie, currentView: 'booking', bookingDetails: { date: '', theater: '', time: '' }, selectedSeats: [] });
        };

        window.updateBooking = (key, value) => {
            setState({ bookingDetails: { ...state.bookingDetails, [key]: value } });
        };

        window.toggleSeat = (seatId, isOccupied) => {
            if (isOccupied) return;
            let seats = [...state.selectedSeats];
            if (seats.includes(seatId)) seats = seats.filter(id => id !== seatId);
            else if (seats.length < 8) seats.push(seatId);
            setState({ selectedSeats: seats });
        };

        window.checkout = (totalAmount) => {
            const ticketData = {
                id: 'LOCAL_' + Math.random().toString(36).substr(2, 9),
                movieTitle: state.selectedMovie.title,
                date: state.bookingDetails.date,
                time: state.bookingDetails.time,
                theater: state.bookingDetails.theater,
                seats: state.selectedSeats,
                amount: totalAmount
            };
            const history = JSON.parse(localStorage.getItem('cv_history') || '[]');
            history.push(ticketData);
            localStorage.setItem('cv_history', JSON.stringify(history));
            setState({ currentView: 'confirm', confirmedTicket: ticketData });
        };

        window.openTrailerModal = (trailerId) => {
            setState({ showTrailer: true, activeTrailerId: trailerId });
        };

        // --- RENDERERS ---
        function renderNav() {
            const isLoggedIn = state.user && state.currentView !== 'login';
            const menuItems = isLoggedIn ? `
                <div class="hidden md:flex gap-8 items-center font-bold text-sm tracking-widest uppercase">
                    <button onclick="resetBookingAndGo('home')" class="transition-colors hover:text-neon-rose ${state.currentView === 'home' ? 'text-neon-rose' : 'text-zinc-500 dark:text-zinc-400'}">Home</button>
                    <button onclick="resetBookingAndGo('movies')" class="transition-colors hover:text-neon-rose ${state.currentView === 'movies' ? 'text-neon-rose' : 'text-zinc-500 dark:text-zinc-400'}">Movies</button>
                    <button onclick="resetBookingAndGo('releases')" class="transition-colors hover:text-neon-rose ${state.currentView === 'releases' ? 'text-neon-rose' : 'text-zinc-500 dark:text-zinc-400'}">Releases</button>
                </div>

        function renderSeats() {
            const m = state.selectedMovie;
            const bd = state.bookingDetails;
            const standardRows = ['A', 'B', 'C', 'D'];
            const reclinerRows = ['E', 'F'];
            const cols = [1, 2, 3, 4, 5, 6, 7, 8];
            const totalAmount = state.selectedSeats.reduce((total, seat) => total + (seat.startsWith('E') || seat.startsWith('F') ? 450 : 250), 0);

            const renderRow = (row, labelClass = "text-zinc-500 dark:text-zinc-600") => {
                let rowHtml = `<div class="flex gap-4 items-center mb-2"><span class="w-6 font-bold text-center ${labelClass}">${row}</span><div class="flex gap-2 sm:gap-3">`;
                cols.forEach(col => {
                    const seatId = `${row}${col}`;
                    const seed = seatId.charCodeAt(0) + seatId.charCodeAt(1) + m.id;
                    const isOccupied = seed % 5 === 0;
                    const isSelected = state.selectedSeats.includes(seatId);
                    const isRecliner = row === 'E' || row === 'F';
                    const addAisle = col === 4;

                    let bgClass = isOccupied ? 'bg-zinc-300 dark:bg-jet-black text-transparent border border-zinc-400/50 cursor-not-allowed opacity-50' : 
                                    isSelected ? (isRecliner ? 'bg-cerulean text-white border border-cerulean shadow-[0_0_15px_rgba(0,123,167,0.4)] transform -translate-y-1' : 'bg-neon-rose text-white border border-neon-rose shadow-[0_0_15px_rgba(255,20,147,0.4)] transform -translate-y-1') : 
                                    'bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 border border-zinc-300 dark:border-zinc-700';
                    let shapeClass = isRecliner ? 'rounded-md' : 'rounded-t-xl';
                    rowHtml += `<button onclick="toggleSeat('${seatId}', ${isOccupied})" class="w-10 h-10 sm:w-12 sm:h-12 transition-all duration-300 flex items-center justify-center text-xs font-bold shadow-sm ${shapeClass} ${bgClass}">${isSelected ? seatId : ''}</button>`;
                    if (addAisle) rowHtml += `<div class="w-6 sm:w-10"></div>`;
                });
                return rowHtml + `</div><span class="w-6 font-bold text-center ${labelClass}">${row}</span></div>`;
            };

            return `
                <div class="max-w-4xl mx-auto px-6 py-12 w-full fade-in zoom-in-95">
                    <div class="flex justify-between items-center mb-8">
                        <button onclick="setState({currentView: 'booking'})" class="flex items-center gap-2 font-bold text-zinc-500 hover:text-neon-rose transition-colors uppercase tracking-wider text-sm"><i data-lucide="chevron-left" class="w-5 h-5"></i> Change Time</button>
                        <div class="text-right">

                            <p class="text-sm font-bold text-zinc-500 uppercase tracking-widest">${bd.date} | ${bd.time}</p>
                        </div>
                    </div>

                            ${standardRows.map(row => renderRow(row)).join('')}
                            <div class="w-full border-t border-black/10 dark:border-zinc-800 my-6"></div>
                            <p class="text-xs font-bold tracking-[0.2em] text-cerulean mb-2 uppercase flex items-center gap-2">⭐ Premium Recliners / ₹450</p>
                            ${reclinerRows.map(row => renderRow(row, "text-cerulean")).join('')}
                        </div>
                        <div class="flex flex-col sm:flex-row justify-between items-center pt-8 border-t border-black/10 dark:border-zinc-800">
                            <div class="mb-6 sm:mb-0 text-center sm:text-left">
                                <p class="text-xs font-bold text-zinc-500 mb-1 uppercase tracking-widest">Selected Seats</p>
                                <p class="font-black text-xl min-h-[28px] text-neon-rose">${state.selectedSeats.length > 0 ? state.selectedSeats.join(', ') : 'NONE'}</p>
                            </div>
                            <div class="flex flex-col sm:flex-row items-center gap-8">
                                <div class="text-center sm:text-right">
                                    <p class="text-xs font-bold text-zinc-500 mb-1 uppercase tracking-widest">Total Amount</p>
                                    <p class="font-black text-3xl text-zinc-900 dark:text-white">₹${totalAmount}</p>
                                </div>
                                <button ${state.selectedSeats.length === 0 ? 'disabled' : ''} onclick="checkout(${totalAmount})" class="px-10 py-4 bg-neon-rose hover:opacity-80 text-white font-black uppercase tracking-widest rounded-lg shadow-[0_0_20px_rgba(255,20,147,0.4)] transition-all disabled:opacity-50 w-full sm:w-auto">Checkout</button>
                            </div>

                    </div>
                </div>
            `;
        }

        function renderConfirm() {
            const t = state.confirmedTicket;
            return `
                <div class="max-w-7xl mx-auto px-6 py-12 w-full">
                    <div class="flex flex-col items-center justify-center fade-in zoom-in-95">
                        <div class="p-10 w-full max-w-md bg-white/90 dark:bg-zinc-900/80 border border-black/10 dark:border-white/10 shadow-2xl rounded-3xl backdrop-blur-xl text-center">
                            <div class="w-20 h-20 bg-green-100 dark:bg-green-500/20 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-200">
                                <i data-lucide="check-circle-2" class="w-10 h-10"></i>
                            </div>
                            <h2 class="text-3xl font-black mb-2 text-zinc-900 dark:text-white uppercase tracking-tight">Confirmed!</h2>
                            <p class="text-sm font-medium mb-8 text-zinc-500 uppercase tracking-widest">Enjoy the show</p>
                            <div class="text-left mb-8 p-6 rounded-xl bg-zinc-50 dark:bg-jet-black border border-black/5 shadow-inner">
                                <h3 class="font-black text-xl mb-6 text-neon-rose uppercase tracking-wide">${t.movieTitle}</h3>
                                <div class="grid grid-cols-2 gap-y-4 gap-x-2 text-sm">
                                    <div><p class="text-zinc-500 font-bold uppercase tracking-wider text-xs mb-1">Date</p><p class="font-bold text-zinc-800 dark:text-zinc-200">${t.date}</p></div>
                                    <div><p class="text-zinc-500 font-bold uppercase tracking-wider text-xs mb-1">Time</p><p class="font-bold text-zinc-800 dark:text-zinc-200">${t.time}</p></div>
                                    <div class="col-span-2"><p class="text-zinc-500 font-bold uppercase tracking-wider text-xs mb-1">Theater</p><p class="font-bold text-zinc-800 dark:text-zinc-200">${t.theater}</p></div>
                                    <div class="col-span-2"><p class="text-zinc-500 font-bold uppercase tracking-wider text-xs mb-1">Seats</p><p class="font-black text-lg text-cerulean">${t.seats.join(', ')}</p></div>
                                    <div class="col-span-2 border-t border-black/10 dark:border-zinc-800 pt-3 mt-1 flex justify-between items-end"><p class="text-zinc-500 font-bold uppercase tracking-wider text-xs">Total Paid</p><p class="font-black text-2xl text-zinc-900 dark:text-white">₹${t.amount}</p></div>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl inline-block mb-8 shadow-xl border border-black/5">
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${t.id}" class="w-32 h-32" />
                            </div>
                            <button onclick="resetBookingAndGo('home')" class="w-full py-4 text-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 text-zinc-900 dark:text-white font-bold uppercase tracking-widest rounded-lg border border-black/5">Back to Dashboard</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHistory() {
            const tickets = JSON.parse(localStorage.getItem('cv_history') || '[]');
            const ticketsHtml = tickets.length === 0 
                ? `<div class="text-center py-24 bg-white/60 dark:bg-zinc-900/60 border border-black/10 dark:border-white/10 rounded-3xl backdrop-blur-md">
                     <i data-lucide="ticket" class="w-16 h-16 text-zinc-400 mx-auto mb-6"></i>
                     <p class="text-2xl font-black mb-2 text-zinc-600 dark:text-zinc-400 uppercase tracking-tight">No Tickets Found</p>
                   </div>`
                : tickets.map(ticket => `
                    <div class="bg-white/90 dark:bg-zinc-900/80 border border-black/10 dark:border-white/10 shadow-lg rounded-2xl p-6 flex flex-col md:flex-row gap-8 items-center backdrop-blur-md">
                        <div class="bg-white p-2 rounded-xl shadow-md border border-black/5 flex-shrink-0">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${ticket.id}" class="w-24 h-24" />
                        </div>
                        <div class="flex-grow w-full text-center md:text-left">
                            <h4 class="font-black text-2xl text-zinc-900 dark:text-white mb-2 uppercase tracking-wide">${ticket.movieTitle}</h4>
                            <p class="text-sm font-bold mb-4 text-cerulean uppercase tracking-widest"><i data-lucide="map-pin" class="inline w-4 h-4 mr-1"></i> ${ticket.theater}</p>
                            <div class="flex flex-wrap justify-center md:justify-start gap-3">
                                <span class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-zinc-50 dark:bg-jet-black border text-zinc-700 dark:text-zinc-300">${ticket.date}</span>
                                <span class="px-4 py-2 rounded-lg text-xs font-bold uppercase bg-zinc-50 dark:bg-jet-black border text-zinc-700 dark:text-zinc-300">${ticket.time}</span>
                                <span class="px-4 py-2 rounded-lg text-xs font-black uppercase bg-neon-rose/10 text-neon-rose border border-neon-rose/20">Seats: ${ticket.seats.join(', ')}</span>
                            </div>
                        </div>
                        <div class="text-right flex-shrink-0 border-t md:border-t-0 md:border-l border-black/10 dark:border-zinc-800 pt-6 md:pt-0 md:pl-8 w-full md:w-auto">
                            <p class="text-zinc-500 font-bold uppercase tracking-wider text-xs mb-1">Total Paid</p>
                            <p class="text-3xl font-black text-zinc-900 dark:text-white">₹${ticket.amount}</p>
                        </div>
                    </div>
                  `).join('');

            return `
                <div class="max-w-4xl mx-auto px-6 py-12 w-full fade-in zoom-in-95">
                    <div class="flex items-center justify-between mb-10">
                        <h2 class="text-3xl font-black text-zinc-900 dark:text-white border-l-4 border-neon-rose pl-4 uppercase tracking-tight">Booking History</h2>
                        <button onclick="resetBookingAndGo('home')" class="font-bold text-zinc-500 hover:text-neon-rose transition-colors uppercase tracking-wider text-sm">Return</button>
                    </div>
                    <div class="flex flex-col gap-6">${ticketsHtml}</div>
                </div>
            `;
        }

        // --- RENDER PIPELINE ---
        function render() {
            let bgImg = MARVEL_BACKGROUNDS[state.currentView] || MARVEL_BACKGROUNDS.home;
            if (state.selectedMovie && (state.currentView === 'booking' || state.currentView === 'seats')) {
                bgImg = state.selectedMovie.image;
            }
            document.getElementById('global-bg').style.backgroundImage = `url('${bgImg}')`;

            let viewHtml = '';
            switch(state.currentView) {
                case 'login': viewHtml = renderLogin(); break;
                case 'home': viewHtml = renderHome(); break;
                case 'movies': 
                case 'releases': viewHtml = renderMoviesList(); break;
                case 'booking': viewHtml = renderBooking(); break;
                case 'seats': viewHtml = renderSeats(); break;
                case 'confirm': viewHtml = renderConfirm(); break;
                case 'history': viewHtml = renderHistory(); break;
            }

            document.getElementById('app-root').innerHTML = renderNav() + `<main class="flex-grow flex justify-center w-full z-10">${viewHtml}</main>`;
            document.getElementById('footer-root').innerHTML = renderFooter();
            
            // Modal handling for YouTube Trailers & Info Links
            let modalContent = '';
            if (state.showTrailer && state.activeTrailerId) {
                modalContent += `
                    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-white/90 dark:bg-jet-black/90 p-4 backdrop-blur-xl" onclick="setState({showTrailer: false, activeTrailerId: null})">
                        <div class="relative w-full max-w-5xl aspect-video bg-black rounded-2xl shadow-2xl overflow-hidden border border-black/10 dark:border-white/10 zoom-in-95 flex items-center justify-center" onclick="event.stopPropagation()">
                            <button onclick="setState({showTrailer: false, activeTrailerId: null})" class="absolute top-4 right-4 z-10 bg-black/50 hover:bg-neon-rose text-white p-3 rounded-full backdrop-blur-md transition-colors border border-white/10">
                                <i data-lucide="x" class="w-6 h-6"></i>
                            </button>
                            <iframe src="https://www.youtube-nocookie.com/embed/${state.activeTrailerId}?autoplay=1&modestbranding=1&rel=0&origin=https://youtube.com" referrerpolicy="strict-origin-when-cross-origin" class="w-full h-full" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            }

            if (state.activeModal) {
                let title = '', bodyText = '';
                if (state.activeModal === 'about') {
                    title = 'About CineVault';
                    bodyText = 'CineVault delivers next-gen luxury movie experiences with seamless ticketing and immersive screening options.';
                } else if (state.activeModal === 'contact') {
                    title = 'Contact Us';
                    bodyText = 'Have questions or need support? Reach out directly via phone or email:\n\nPhone: 8141430155/9213653979\nEmail: luckyjain83738@gmail.com';
                } else if (state.activeModal === 'privacy') {
                    title = 'Privacy Policy';
                    bodyText = 'We value your personal privacy and protect your data securely. All booking records are stored locally for your convenience.';
                }

                modalContent += `
                    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-white/80 dark:bg-jet-black/80 p-4 backdrop-blur-md" onclick="setState({activeModal: null})">
                        <div class="relative w-full max-w-lg p-8 bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl border border-black/10 dark:border-white/10 zoom-in-95" onclick="event.stopPropagation()">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-2xl font-black text-zinc-900 dark:text-white uppercase tracking-tight">${title}</h3>
                                <button onclick="setState({activeModal: null})" class="p-2 text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <p class="text-zinc-600 dark:text-zinc-400 leading-relaxed font-medium whitespace-pre-line mb-8">${bodyText}</p>
                            <button onclick="setState({activeModal: null})" class="w-full py-3 bg-neon-rose hover:opacity-80 text-white font-bold rounded-lg uppercase tracking-wider text-sm transition-all">Close</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('modal-root').innerHTML = modalContent;
            lucide.createIcons();

            document.querySelectorAll('.tilt-card').forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const rotateX = (((e.clientY - rect.top) - (rect.height / 2)) / (rect.height / 2)) * -10;
                    const rotateY = (((e.clientX - rect.left) - (rect.width / 2)) / (rect.width / 2)) * 10;
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                    card.style.transition = 'none';
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    card.style.transition = 'transform 0.5s ease-out';
                });
            });
        }

        // --- START APP ---
        render();
        loadRealImages();
    </script>
</body>
</html>
